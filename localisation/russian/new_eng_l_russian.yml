l_russian:
ENG_strong_Empire: "Боже, храни Империю!"
ENG_strong_Empire_desc: "Империя — не просто государство, а священное наследие поколений. Пока звучит наш гимн, ни один враг не усомнится в величии Короны."

ENG_imperial: "Культ короля"
ENG_imperial_desc: "Король — символ единства, порядка и судьбы нации. Его образ должен стать неоспоримым авторитетом для каждого подданного Империи."

ENG_zakrit_profsouz: "Сформировать Имперскую рабочую службу"
ENG_zakrit_profsouz_desc: "Вместо разрозненных профсоюзов будет создана единая Имперская рабочая служба, подчинённая государству и служащая интересам Империи, а не частным амбициям."
ENG_aristokrati: "Увеличить лояльность аристократии"
ENG_aristokrati_desc: "Аристократия веками была опорой Короны. Поддержав её интересы, мы укрепим внутреннюю стабильность и политическую верность элит."

ENG_nationalizm_britania: "Пропагандировать Британский национализм"
ENG_nationalizm_britania_desc: "Мы напомним народу о его исключительной миссии и праве вести за собой мир, объединяя подданных Империи общей идеей и гордостью."

ENG_up_the_homeguard: "Поднять домашняю нац.гвардия"
ENG_up_the_homeguard_desc: "Каждый дом должен стать крепостью. Усиление национальной гвардии обеспечит защиту метрополии от любых внешних и внутренних угроз."
ENG_national_defens: "Политика национальной обороны"
ENG_national_defens_desc: "Империя не ищет войны, но должна быть готова к ней всегда. Новая оборонная доктрина укрепит безопасность и стратегическую устойчивость государства."

ENG_pobori_dominions: "Поборы с доминионов"
ENG_pobori_dominions_desc: "Доминионы обязаны внести свой вклад в общее дело. Экономические отчисления укрепят метрополию и позволят финансировать имперские проекты."

imperial_economic: "Имперские экономические Хартии"
imperial_economic_desc: "Единые экономические хартии свяжут Империю в неразрывную систему, подчинив торговлю, ресурсы и промышленность интересам Короны."

kult_of_king: "Культ его Высочества"
