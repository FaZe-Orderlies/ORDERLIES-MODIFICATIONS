decision_cost_dopp_700_blocked: "£GFX_eng_go_and_get_texticonn £infantry_equipment_texticon §R700§!"

decision_cost_ARTA_499: "£GFX_eng_go_and_get_texticonn £special_project_superheavy_artillery_texticon §Y500§!"
