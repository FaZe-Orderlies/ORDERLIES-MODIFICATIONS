USA_gold_for_uk.b: "Стоит попробовать"

USA_gold_for_uk.2t: "Второй этап сотрудничества с Англией"
USA_gold_for_uk.2d: "Наши союзники из за океана недавно снова направили нам предложение,в котором они предлагали баснословную сумму за некоторых проффесианол,прибывших недавно из нашей страны.Королевская семья и члены парламента уже предупреждены и большая часть из них прогосовала за,ведь с налаживание экономических связей с Америкой пойдет на пользу не только им,но и нам."
USA_gold_for_uk.2a: "И первый раз был ошибкой,второй договор с Америкой станет убийственным"
USA_gold_for_uk.2b: "Стоит попробовать и в этот раз"

USA_gold_for_uk.3t: "Третий и финальный этап сотрудничества с Англией"
USA_gold_for_uk.3d: "Американцы предложили окончательно и официально заверить наши экономические отношения.Они хотят,чтобы часть наших судостроительных предприятий переехала к ним,а также и часть персонала,работающего там.Взамен они готовы заплатит огромную сумму,вдоволь покрывающие все наши расходы."
USA_gold_for_uk.3a: "Мы практически станет вассалом!"
USA_gold_for_uk.3b: "Выпьем за наших новых друзей"
