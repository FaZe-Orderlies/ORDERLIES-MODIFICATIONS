USA_america_first_mod_desc: "Нация должна быть на первом месте. Внутренняя политика и экономика должны служить интересам американского народа, а не глобальным амбициям или иностранному влиянию."
USA_administration_national_recovery: "Администрация национального восстановления"
USA_administration_national_recovery_desc: "Программа, направленная на восстановление экономики и инфраструктуры страны после Великой депрессии, с акцентом на создание рабочих мест, поддержку промышленности и сельского хозяйства."
USA_remove_toplyak_debuff_polovina: "Разрешить нефтяной кризис"
USA_remove_toplyak_debuff_polovina_desc: "США должны найти способы обеспечить себя топливом, чтобы не зависеть от иностранных поставок. Это включает в себя разработку новых месторождений, инвестирование в альтернативные источники энергии и повышение эффективности использования топлива."
USA_grants_to_our_farmers: "Гранты американским фермерам"
USA_grants_to_our_farmers_desc: "Поддержка сельского хозяйства через финансовые гранты, субсидии и программы обучения для обеспечения продовольственной безопасности и помощи фермерам в трудные времена."
USA_small_bussines: "Малый бизнес Америки"
USA_small_business_desc: "Поддержка малого бизнеса через налоговые льготы, доступ к кредитам и программы обучения для стимулирования экономического роста и создания рабочих мест."
USA_cash_to_infra: "Выделить средства на инфраструктуру"
USA_cash_to_infra_desc: "Инвестиции в такие объекты инфраструктуры, как дороги, мосты, железные дороги и сети связи, для создания рабочих мест и повышения экономической эффективности."
USA_support_corporates: "Поддержать корпорации"
USA_support_corporates_desc: "Поддержка крупных корпораций через налоговые льготы и субсидии для стимулирования экономического роста и создания рабочих мест."
USA_dotations_for_ford: "Дотации для «Форда»"
USA_dotations_for_ford_desc: "Поддержка автомобильной промышленности через прямые финансовые вливания для сохранения рабочих мест и стимулирования индустриального роста."
USA_american_capitalism: "Американский капитализм"
USA_american_capitalism_desc: "Система, поощряющая свободный рынок, частную собственность и конкуренцию для обеспечения экономического процветания."
USA_brains_of_america: "Умы Америки"
USA_brains_of_america_desc: "Поддержка образования и научных исследований для развития инноваций и поддержания экономического лидерства."
USA_new_resiki: "Открытие новых месторождений"
USA_new_resiki_desc: "США должны активно исследовать и разрабатывать новые месторождения природных ресурсов, чтобы обеспечить экономическую безопасность и независимость от импорта."
USA_VPK: "Военно-промышленный комплекс"
USA_VPK_desc: "Поддержка и развитие военно-промышленного комплекса для обеспечения национальной безопасности и технологического превосходства."
USA_production_for_victory: "Производство для победы"
USA_production_for_victory_desc: "Мобилизация промышленности для военных нужд: производство оружия, техники и ресурсов, необходимых для триумфа в войне."
USA_new_voenki: "Новые военные заводы"
USA_new_voenki_desc: "Инвестиции в строительство новых оборонных предприятий для увеличения производственных мощностей страны."
USA_national_voenikzz: "Национальная программа вооружений"
USA_national_voenikzz_desc: "Разработка и реализация комплексной программы по оснащению армии современными образцами техники и вооружения."
USA_update_dockyards: "Расширение военно-морских верфей"
USA_update_dockyards_desc: "Модернизация существующих и строительство новых верфей для обеспечения флота необходимым тоннажем."
USA_national_dockyards: "Верфи национальной обороны"
USA_national_dockyards_desc: "Государственная программа развития кораблестроения для обеспечения морского могущества США."
USA_federal_institute: "Федеральный институт военных технологий"
USA_federal_institute_desc: "Создание единого центра для координации исследований и разработок в области обороны."
USA_atom_sheild_of_america: "Атомный щит Америки"
USA_atom_sheild_of_america_desc: "Развитие ядерной программы как гаранта национальной безопасности и сдерживающего фактора."
USA_American_imperialism: "Американский империализм"
USA_American_imperialism_desc: "Расширение влияния и контроля над другими странами с использованием экономической, военной и культурной мощи для продвижения своих интересов."
USA_the_new_world_order: "Новый мировой порядок"
USA_the_new_world_order_desc: "Установление мироустройства, в котором США будут играть ведущую роль, транслируя свои ценности и интересы по всему земному шару."
USA_nationalist_propaganda: "Националистическая пропаганда"
USA_nationalist_propaganda_desc: "Использование средств массовой информации для укрепления национального единства и повышения уровня патриотизма."
USA_mexican_oil_is_our_oil: "Присвоить мексиканскую нефть"
USA_mexican_oil_is_our_oil_desc: "Установление контроля над нефтяными ресурсами Мексики для обеспечения энергетической безопасности США."
USA_banan_republic: "Банановые республики"
USA_banan_republic_desc: "Установление контроля над странами Центральной Америки и Карибского бассейна, превращая их в сырьевые придатки для нужд американского рынка."
USA_greenland_potential: "Потенциал Гренландии"
USA_greenland_potential_desc: "Освоение природных богатств Гренландии, включая минералы и углеводороды, для усиления экономической мощи."
USA_create_atlantic_placdarm: "Создание атлантического плацдарма"
USA_create_atlantic_placdarm_desc: "Установление военного присутствия в Атлантике для контроля морских путей и защиты национальных интересов."
USA_empire_of_west: "Империя Запада"
USA_empire_of_west_desc: "Установление полной гегемонии над Западным полушарием и странами Латинской Америки."
USA_finish_the_british_hegemony: "Конец британской гегемонии"
USA_finish_the_british_hegemony_desc: "Вытеснение Великобритании из её традиционных сфер влияния и подрыв британского могущества."
USA_finish_windsor_rule: "Конец правления Виндзоров"
USA_finish_windsor_rule_desc: "Политическое и дипломатическое давление с целью ослабления влияния британской монархии."
USA_american_sphere: "Американская сфера влияния"
USA_american_sphere_desc: "Максимальное расширение зон контроля США по всему миру."
USA_potential_of_far_east: "Потенциал Дальнего Востока"
USA_potential_of_far_east_desc: "Использование экономических и стратегических возможностей дальневосточного региона."
USA_hawaii_start: "Гавайский плацдарм"
USA_hawaii_start_desc: "Укрепление контроля над Гавайями как ключевой базой для проекции силы в Тихом океане."
USA_use_phillipies: "Использовать Филиппины"
USA_use_phillipies_desc: "Нужно превратить Филиппины в важнейший стратегический узел и плацдарм в Юго-Восточной Азии."
USA_update_marines_corps: "Усиление Корпуса морской пехоты"
USA_update_marines_corps_desc: "Инвестиции в модернизацию элитных подразделений морской пехоты для проведения амфибийных операций."
USA_control_strategic_resources: "Контроль стратегических ресурсов"
USA_control_strategic_resources_desc: "Обеспечение бесперебойного доступа к дефицитным ресурсам: нефти, редким металлам и каучуку."
USA_prepare_to_battle: "Битва за Тихий океан"
USA_prepare_to_battle_desc: "Подготовка к неизбежному столкновению с Японией и Британией за господство в тихоокеанском регионе."
USA_attack_australasia: "Удар по Австралазии"
USA_attack_australasia_desc: "Нейтрализация влияния Австралазии и захват её стратегических баз."
USA_question_of_ost_india: "Вопрос Голландской Ост-Индии"
USA_question_of_ost_india_desc: "Решение судьбы богатого ресурсами региона Юго-Восточной Азии."
USA_zakrepitsa_in_australasia: "Закрепиться в Австралазии"
USA_zakrepitsa_in_australasia_desc: "Превращение австралийских территорий в опорный пункт американского влияния."
USA_we_need_rezina: "Захват месторождений каучука"
USA_we_need_rezina_desc: "Прямой контроль над производством каучука, жизненно важного для военной промышленности."
USA_we_need_china: "Подчинение китайских земель"
USA_we_need_china_desc: "Установление контроля над колоссальными ресурсами и рынками Китая."
USA_destroy_japan: "Сокрушить Японию"
USA_destroy_japan_desc: "Полное военное и экономическое устранение главного конкурента в Азии."
USA_america_is_prioritet: "Америка превыше всего"
USA_america_is_prioritet_desc: "Бескомпромиссная защита национальных интересов в любой точке земного шара."
USA_mandate_on_peremeni: "Мандат на перемены"
USA_mandate_on_peremeni_desc: "Использование всей мощи США для радикального переустройства мирового порядка."
USA_no_to_izolaciya: "Отказ от изоляционизма"
USA_no_to_izolaciya_desc: "США выходят из тени: активное вмешательство в международные дела для обеспечения глобального лидерства."
USA_defence_american_intiresi: "Защита американских интересов"
USA_defence_american_intiresi_desc: "Противодействие любым угрозам и активное продвижение американской повестки."
USA_american_century_now: "Век Америки начинается"
USA_american_century_now_desc: "Установление тотального американского доминирования в XX веке."
USA_enemies_of_country: "Враги государства"
USA_enemies_of_country_desc: "Беспощадная борьба с внутренними и внешними противниками режима."
USA_narodik: "Сегрегация общества"
USA_narodik_desc: "Проведение политики жесткого социального и расового разделения для обеспечения контроля и стабильности."
USA_new_national_politik: "Новая национальная политика"
USA_new_national_politik_desc: "Реализация курса на укрепление государственности и национального духа."
USA_upravlenie_national_politik: "Управление национальной политикой"
USA_upravlenie_national_politik_desc: "Создание эффективных механизмов контроля над внутренней и внешней политикой государства."
USA_komitet_national_security: "Комитет американской безопасности"
USA_komitet_national_security_desc: "Создание структуры для координации всех усилий по защите нации от угроз."
USA_national_edintstvo: "Национальное единство"
USA_national_edintstvo_desc: "Сплочение американского народа вокруг государственных идеалов."
USA_american_patriots: "Американский патриотизм"
USA_american_patriots_desc: "Воспитание преданности родине и готовности защищать её интересы любой ценой."
USA_prepare_to_global_war: "Подготовка к мировой войне"
USA_prepare_to_global_war_desc: "Всеобщая милитаризация и подготовка к глобальному конфликту за передел мира."
USA_national_voenkizz: "Федеральные военные заказы"
USA_national_voenkizz_desc: "Стимулирование экономики через масштабные государственные закупки вооружений."
USA_nezavisimost_economy: "Экономическая автаркия"
USA_nezavisimost_economy_desc: "Достижение полной самообеспеченности ресурсами и технологиями."
USA_more_national_guard: "Расширение Национальной гвардии"
USA_more_national_guard_desc: "Усиление резервных сил для поддержания порядка внутри страны и помощи регулярной армии."
USA_strong_president: "Сильный президент"
USA_strong_president_desc: "Концентрация власти в руках главы государства для эффективного управления в кризисные времена."
USA_power_the_CIA: "Сформировать ЦРУ"
USA_power_the_CIA_desc: "Расширение полномочий разведки для ведения тайных операций по всему миру."
USA_military_machine_of_USA: "Военная машина США"
USA_military_machine_of_USA_desc: "Создание самой мощной армии в истории человечества для защиты Pax Americana."
USA_federal_voenki: "Федеральные Военные заказы"
USA_federal_voenki_desc: " "
USA_com_polux_decision_cat: "Установление коммунизма в странах Америки"
USA_mexico: "Экспорт Революции на Юг"
USA_central_america_com: "Красный Пояс Центральной Америки"
USA_caribbean_bassein: "Острова Революции"
USA_canada: "Канадская Народная Республика"
USA_mio_trait_republic_aviation3_trait: "Эксперименты с броней"
USA_sverhbust: "Торговая Изоляция"
USA_rezina: "Расширенное производство синтетической резины"
