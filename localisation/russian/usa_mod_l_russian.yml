fra_decision_cost_dopp_700_blocked: "£GFX_FRA_go_and_get_texticon £infantry_equipment_texticon §R700§!"

fra_decision_cost_INF_2500: "£GFX_FRA_go_and_get_texticon £infantry_equipment_text_icon §Y3500§!"
fra_decision_cost_INF_2500_blocked: "£GFX_FRA_go_and_get_texticon £infantry_equipment_text_icon §R3500§!"

USA_pay_and_go_cat: "§YПрограма "Заплати и Получи"§!"
USA_pay_and_go_cat_desc: "Наша уникальная программа "Заплати и Получи" станет новым витком экономических связей между нами и нашими союзниками.Мы сможем предложить им новейшее оружие,пока они будут вкладываться в нашу экономику."

ENG_pay_and_go: "Пехотное снаряжение для §YАнглии§!"
ENG_pay_and_go_DOPP: "Допп. снаряжение для §YАнглии§!"
ENG_pay_and_go_ARTA: "Артиллерия для §YАнглии§!"

FRA_pay_and_go_ARTA: "Артиллерия для §YФранции§!"
FRA_pay_and_go_DOPP: "Допп. снаряжение для §YФранции§!"
FRA_pay_and_go:  "Пехотное снаряжение для §YФранции§!"

USA_lend_lease_action: "Программа Ленд-Лиза"
USA_lend_lease_action_desc: "Отныне оружие будет течь рекой туда, где решается судьба свободы. Америка становится кредитором не только денег, но и самой победы, связывая своё будущее с исходом мировой бойни."

USA_asia_important: "§RСфокусироваться на Азии§!"
USA_asia_important_desc: "Стратеги спорят: где сердце войны? Сторонники тихоокеанского приоритета указывают на уязвимость Филиппин, Гавайев и торговых путей. Азия может стать ареной решающего столкновения цивилизаций."

USA_accent_in_Europe: "§2Сфокусироваться на Европе§!"
USA_accent_in_Europe_desc: "Европейцы утверждают, что падение Лондона или Москвы сделает Америку следующей целью. Сначала должен быть уничтожен источник зла — гитлеровская Германия."

USA_asia_tvd: "Театр военных действий на Тихом океане"
USA_asia_tvd_desc: "Океанская война не похожа на европейскую. Здесь решают авианосцы, дальность полёта и выносливость морской пехоты. Необходимо создать совершенно новую военную культуру."

USA_jap_number_one: "Япония цель номер один"
USA_jap_number_one_desc: "Для флота именно Токио является главным противником. Удар по японской империи вернёт контроль над морями и защитит западное побережье."

USA_germany_number_one: "Германия цель номер один"
USA_germany_number_one_desc: "Армейские стратеги убеждены: пока Рейх существует, любая победа в Азии будет временной. Европа должна стать приоритетом, даже если это непопулярно у избирателей."

USA_bases_in_pacific_ocean: "Базы на Тихом океане"
USA_bases_in_pacific_ocean_desc: "Логистика решит больше, чем героизм. Сеть баз позволит шаг за шагом приближаться к японским островам, превращая океан в американское озеро."

USA_war_esm: "Военные базы в обмен на эсминцы"
USA_war_esm_desc: "Сделка с Британией — символ конца старого нейтралитета. Мы отдаём корабли, но получаем ключевые точки Атлантики, превращая океан в первую линию обороны США."

USA_bases_in_atlantika: "Базы в Атлантике"
USA_bases_in_atlantika_desc: "Карибы, Ньюфаундленд и Бермуды становятся бастионами против подводной угрозы. Отныне путь к американским берегам закрыт сетью радаров и аэродромов."

USA_hist_Way: "Продолжение выполнения плана нового курса"

USA_continue_of_neutrality: "§YПродолжить политику нейтралитета§!"
USA_continue_of_neutrality_desc: "Европейские войны - не наши войны. Соединённые Штаты обязаны сохранить дистанцию от чужих конфликтов, сосредоточившись на защите собственных границ и процветании американского народа."

USA_politic_of_peace: "Политика добрососедства"
USA_politic_of_peace_desc: "Отказ от прямого вмешательства в дела Латинской Америки должен показать, что США - не завоеватель, а надёжный партнёр. Мир в полушарии начинается с уважения к соседям."

USA_doctrine_monro: "Подтвердить доктрину монро"
USA_doctrine_monro_desc: "Любая попытка европейских держав вернуть влияние в Новом Свете будет встречена решительным сопротивлением. Западное полушарие - зона исключительных интересов Америки."

USA_politic_defend_hemisphere: "Доктрина обороны западного полушария"
USA_politic_defend_hemisphere_desc: "Нейтралитет не означает слабость. Мы обязаны подготовиться к защите континента от любого агрессора, каким бы флагом он ни прикрывался."

USA_comitet_of_defend_of_himesphere: "§YКомитет обороны полушария§!"
USA_comitet_of_defend_of_himesphere_desc: "Создание постоянного координационного органа позволит объединить усилия армии, флота и промышленности ради единой цели - безопасности Америки."
USA_war_plan_whiter: "Военный план белый"
USA_war_plan_whiter_desc: "Штаб армии разработал стратегию возможного конфликта с северным соседом. Пусть это лишь теория, но наивность обошлась миру слишком дорого."

USA_reform_war_plan_white: "Переработка военного плана белый"
USA_reform_war_plan_white_desc: "Меняющаяся обстановка требует обновления старых расчётов. План должен учитывать современную технику, авиацию и новые формы войны."

USA_economic_of_world: "§BЭкономика мира§!"
USA_economic_of_world_desc: "Даже изоляционизм невозможен без торговли. Контролируя мировые рынки мирными средствами, Америка укрепляет своё влияние без единого выстрела."

USA_defeat_threat_of_stability: "Устранение угроз стабильности"
USA_defeat_threat_of_stability_desc: "Экстремисты, радикалы и иностранные агенты подрывают наш тыл. Внутренний порядок — первая линия обороны государства."

USA_form_defens: "Формирование договора об обороне полушария"
USA_form_defens_desc: "Объединив страны Америки в общий оборонительный блок, мы сделаем любое вторжение самоубийством для врага."

USA_up_armies: "§GУсиление армий наших союзников§!"
USA_up_armies_desc: "Пусть соседи сами защищают свои рубежи, но с нашим оружием, инструкторами и промышленной поддержкой."

USA_upornost: "§YАмериканская упорность§!"
USA_upornost_desc: "Народ Соединённых Штатов способен вынести любые испытания, если знает, за что борется — за дом, свободу и континент."

USA_growth_plan_white: "Распространение военного плана белый"
USA_growth_plan_white_desc: "Положения плана должны лечь в основу общей стратегии на всём севере континента, включая инфраструктуру и мобилизацию."

USA_defend_hemisphere_to_end: "Оборона континента до последнего"
USA_defend_hemisphere_to_end_desc: "Ни шагу назад. Враг может пройти океаны, но он утонет в бесконечных просторах Америки."

USA_propoganda_americanism: "§2Пропаганда Американизма§!"
USA_propoganda_americanism_desc: "Идеалы свободы, республики и самодостаточности должны стать щитом против чуждых идеологий."
USA_resources_of_rezina: "Программа развития резиновых производств"
USA_resources_of_rezina_desc: "Зависимость от заморских поставок недопустима. Собственная синтетическая резина — залог независимости армии и флота."

USA_recoursec_program: "Проект национальной ресурсной безопасности"
USA_recoursec_program_desc: "Стратегические материалы должны добываться и храниться внутри страны, а не ждать милости иностранных рынков."

USA_defend_yourself: "§2Обезопасить себя§!"
USA_defend_yourself_desc: "Крепкие границы, подготовленные города и бдительное население — лучшая гарантия мира."

USA_get_military_bases: "Получение военных баз на континенте"
USA_get_military_bases_desc: "Договоры аренды и взаимной обороны позволят разместить наши силы в ключевых точках Нового Света."

USA_support_sosedei: "Поддержка соседей"
USA_support_sosedei_desc: "Экономическая и военная помощь укрепит дружественные режимы и не допустит появления враждебных плацдармов у наших границ."
USA_trade_agreements: "Торговые соглашения"

USA_investions_in_latin_america: "§YИнвестиции в Латинскую и Южную америку§!"
USA_investions_in_latin_america_desc: "Доллары и инженеры часто эффективнее дивизий. Экономическая интеграция привяжет континент к Вашингтону крепче любых цепей."

USA_stop_british_empire: "§2Остановить Британскую Империю§!"
USA_stop_british_empire_desc: "Лондон всё ещё мечтает о господстве в Атлантике. Пришло время напомнить, что эпоха колониальных империй закончилась."

USA_radars_in_atlantika: "Радарная сеть в Атлантике"
USA_radars_in_atlantika_desc: "Ни один самолёт и ни один корабль не должен приблизиться к нашим берегам незамеченным."

USA_strike_london: "Нанести удар по Лондону"
USA_strike_london_desc: "Если старая империя не уважает Новый Свет, ей придётся столкнуться с силой, которую она сама когда-то породила."

USA_stop_threat_from_east: "§RОстановить угрозу с востока§!"
USA_stop_threat_from_east_desc: "Азиатские милитаристы и европейские диктаторы угрожают самому существованию свободного мира. Лучше остановить их у океана, чем у Калифорнии."

USA_radars_in_tixom_ocean: "Радары в тихом океане"
USA_radars_in_tixom_ocean_desc: "Тихий океан больше не должен быть «тихим» для наших наблюдателей. Раннее предупреждение спасёт тысячи жизней."

USA_free_asia_from_who: "Освободить Азию от узурпаторов"
USA_free_asia_from_who_desc: "Народам Востока нужен не новый хозяин, а право самим решать свою судьбу — под покровительством Америки."
USA_strike_jap: "Нанести удар по Токио"

USA_enter_canada: "§YВвести войска в Канаду§!"
USA_enter_canada_desc: "Для безопасности континента северные территории должны быть под нашим прямым контролем, даже если это потребует решительных мер."

USA_free_canada: "Укрепить Канадскую свободу"
USA_free_canada_desc: "Канада должна стать истинно независимым и дружественным государством, связанным с США общей обороной и экономикой."

USA_interbention: "§YАмерика примет закон о частичном вмешательстве,что в дальнейшем развяжет ей руки во внешней политике,а также даст возможность действовать на ее континенте.§!"

USA_TVA: "Расширение производств"

####ГУИШКА НА ЗОЛОТО ДЛЯ ПИНДОСОВ####
USA_gold: "§YПромышленное сотрудничество со странами европы§!"
USA_gold_desc: "Нам пора выходит на мировую арену политики.Мы можем начать запрашивать промышленную и экономическую интеграцию с самыми развитыми странами европы,такие как Англия и возмодно в дальнейшем Франция и Бельгия"
USA_goold_texticon: "Открывает механику,которая позволит экономически интегрировать другие страны и выглядит она так:\n\n\n\n\n\n\n£GFX_usa_economy_coop_texticon\n\n\n\n\n\n\n\n§RВ пике даст +22.5% обьема военных завода,+22.5% обьема верфей и +22.5% макc. производства.§bбебебе§!"

USA_gold_1: "§YПромышленные предложения французам§!"
USA_gold_1_desc: "Французы показывают невероятные показатели экономические роста и бешенного темпа наращивания промышленности.Мы можем направить им наши предложения по промышленному сотрудничеству и начать работать вместе."
gold_gui_1_tt: "§YФранция станет доступной для предложений по экономическому сотрудничеству§!"

USA_gold_2: "§YПромышленные предложения бельгийцам!"
USA_gold_2_desc: "Бельгийцы разработали невероятные станки,повышающие макисмальный показатели производства в 2 раза.Наша промышленность очень остает в этом плане,и бельгийцы очень могут нам помочь в наверстывание этого отставания."
gold_gui_2_tt: "§YБельгия станет доступной для предложений по экономическому сотрудничеству§!"


fra_gold: "§YФранция§!"
eng_gold: "§YАнглия§!"
bel_gold: "§YБельгия§!"
comment_golden: "Страны §Rне будут доступны§! для предложения если:\n§R1)У страны правящая партия коммунизм или фашизм§!\n§R2)Страна отказал нам в продолжение сотрудничества§!"

bel_dm_from_gold: "[BEL_FASHIKS_COOL]" #пдх тултип для бельгии
BEL_yes_fash: "§RСтрана недоступна для предложения,так как там правят враждебная нам партия(коммунисты или фашисты)§!" #ВО ВЛАСТИ ФАШИКИ ИЛИ КОМИ
BEL_no_fash:  "Бельгийцы известны своими станками и эффективностью производства.Наше сотрудничество принесет лишь пользу нашей легкой промышленности и вот что нам это даст\n\n1-й этап)§YДобавит динамический модификатор "Сотрудничество с Бельгией",что даст:§!\nМакс. эффективность производства: §G5.0% §!\n-----------------------------------------------------------------2-oй этап)§YИзменить "Сотрудничество с Бельгией" на:§!\nМакс. эффективность производства: §G7.5% §!\n-----------------------------------------------------------------3-ий этап)§YИзменить "Сотрудничество с Бельгией" на:§!\nМакс. эффективность производства: §G10.0%§!\n\n§RВ итоге бельгийцы могут дать нам 22.5% макс. эффективности производства§!" #ВО ВЛАСТИ НЕ ФАШИКИ ИЛИ КОМИ
