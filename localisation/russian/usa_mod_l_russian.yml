USA_gold_for_fra.1t: "Первый этап сотрудничества с Францией"
USA_gold_for_fra.1d: "Американцы предлагают направить наших промышленников в их страну,чтобы помочь им улучшить их производство.За это они готовы хорошо заплатить,однако наши технологии частично окажуться у них.Часть Sénat de la France проголосовала за,другая против."
USA_gold_for_fra.a: "Мы против сотрудничества с Америкой"
USA_gold_for_fra.b: "Стоит попробовать"

USA_gold_for_fra.2t: "Второй этап сотрудничества с Францией"
USA_gold_for_fra.2d: "Американцы во второй раз отправили парламентеров по дело о сотрудничестве наих сран в сфере промышленности.Они предлагают выкупить часть промышленников,которые сейчас находяться в их стране,предоставим им самые комфортные условия жизни.Также они хотят открыть новые высшие заведения,где преподавать будут наши эксперты."
USA_gold_for_fra.2a: "Впервый раз мы согласились,но сейчас это зашло слишком далеко"
USA_gold_for_fra.2b: "Стоит попробовать и в этот раз"

USA_gold_for_fra.3t: "Третий и финальный этап сотрудничества с Францией"
USA_gold_for_fra.3d: "Спустя почти 1.5 лет продуктивной совместной работы,американцы хотят окончательно закрепить наше сотрудничество договором.20% выпускников наших топовых инженерных вузов будут отправляться в Америку,для прохождения практики.Там им будут платить достойную зарплату,даже выше чем у нас.Они смогут набираться опыта и передавать его в дальнейшем нашим американским коллегам."
USA_gold_for_fra.3a: "Впервый и второй раз мы согласились,но сейчас это зашло слишком далеко"
USA_gold_for_fra.3b: "Сотрудничество с Америкой будет на пользу нам обоим"
