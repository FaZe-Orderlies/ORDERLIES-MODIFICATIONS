fra_decision_cost_ARTA_499: "£GFX_FRA_go_and_get_texticon £special_project_superheavy_artillery_texticon §Y500§!"
fra_decision_cost_ARTA_499_blocked: "£GFX_FRA_go_and_get_texticon £special_project_superheavy_artillery_texticon §R500§!"

