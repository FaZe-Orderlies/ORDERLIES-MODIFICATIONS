l_russian:

USA_GATHERING_STORM_DESC_mod: "Соединенные Штаты вернулись к состоянию изоляции к концу Первой мировой войны и короткое время в 20-х годах наслаждались экономическим подъемом. Великая депрессия положила этому трагический конец.\n\nАмериканская политика невмешательства в европейские дела осталась непоколебима, но невозможно не ощущать растущего напряжения в Европе и Азии. Хочет он того или нет, но «Великого нейтрала» также может захлестнуть этот водоворот.\n\nТакже голову поднимают и коммунисты,которые имеют реальную возможность захвата власти и проведения коммунистических реформ в Америке."

USA_isolation: "[USA_plan_economy]"
USA_fake_great_deppresion: "Великая Депрессия"
USA_plan_economy_focus: "Плановая Экономика"
USA_plan_economy_nofocus: "Великая Депрессия"
USA_plan_economy_focus_vpo: "Стабильная рыночная экономика"
USA_plan_economy_focus_partial_intervention: "Кейнсианская экономика"

USA_oil_problem: "Слабая нефтянная промышленность"
USA_oil_problem_tt: "Изменить §Y$USA_oil_problem$§! на:"

###ПРОМКА НОУ КОММ
USA_WPA: "§YУправление промышленно-строительными работами§!"
USA_WPA_desc: "ВПА-Это независимое федеральное агентство,созданоЕ по инициативе президента США Франклина Делано Рузвельта. Его цель — обеспечить работой миллионы безработных, в основном неквалифицированных мужчин, в рамках Нового экономического курса"

USA_law_about_social: "Социальный статус американцев"
USA_law_about_social_desc: "Американцы сейчас живут лучше,чем большинство других стран.Однако нарастающий экономический и социальный кризис могут повлиять на этот рост.Нужно задаться вопросом,а какой социальный статус у американца?Чем он отличается от других людей?Ответив на них,мы сможем и дальше развивать нашу страну."

USA_confidence_building_company: "Расширенное финансирование гос. корпораций"
USA_confidence_building_company_desc: "Вложив лишние деньги,мы можем замедлить экономическую рецессию,поразившую экосистему нашей страны."

USA_dam_construction: "План Макмиллана"
USA_dam_construction_desc: "План Макмиллана-это огромный проект,затрагивающей весь Вашингтон.Он предпологал строительство крупных выстоных зданий,новейшей инфраструктуры и крупнейшей в мире,на тот момент,дамбы,которая могла бы обеспечивать светом весь штат."

USA_plan_to_help_farmers: "Помощь фермерам"
USA_plan_to_help_farmers_desc: "Наше сельское хозяйство уже 5 год страдает из за великой экономической депрессии.Они не могут обновить технику,в следствие чего теряет большую часть урожая.А взять кредит для них слишком накладно,так как проценты огромные.Но мы можем создать специальные льготные условия,на которых им будет выгодно обращаться в банк."

USA_civilian_corps: "Развитие юга страны"
USA_civilian_corps_desc: "Юг страны очень сильно отстает от всей остальной страны.Нам нужно увеличть финансирование региона и влодить в инфраструктуру и промышленность."

USA_rural_development_program: "Решение государственого кризиса"
USA_rural_development_program_desc: "В нашем государственном аппарате уже давно наблюдается застой,а порой даже откат.Нам нужны свежые умы,свежые люди,способные изменить состояние страны."

USA_national_resource_council_dm: "§YКомитет по развитию ресурсов§!"
USA_resource_gay_tt: "Изменить $USA_national_resource_council_dm$ на:"
USA_national_resource_council: "Комитет по развитию ресурсов"
USA_national_resource_council_desc: "Необходимо создать целый комитет по контролю за редкоземельными ресурсами на нашей цемле.К сожалению,сейчас популярна коррупция в рядах гос. служащих и чтобы убедиться,что деньги идут в нужное место,мы создадим особый отряд,следящий и отвечающий за развитие ресурсов в США."

USA_strategic_supply_planning: "Создать стратегический запас ресурсов"
USA_strategic_supply_planning_desc: "Необходимо создать запас ресурсов на черный день.Сохранив их,мы сможем в крайнем случае ими воспользовать в нужный момент."

USA_research_council: "§YУправление научно-технической политики§!"
USA_research_council_desc: "Нам нужно развивать американская науку.Наша земля всегда показывала свету великих и гениальных людей,и в "новом свете" умные люди всегда ценились.Так почему мы должны их не ценить.Нам нужно поднять степендии,выделить деньги на строительство новых институтов и школ,а также начать програму по поиску гениальных детей."

USA_tennessee_valley_authority: "Администрация Долины Теннесси"
USA_tennessee_valley_authority_desc: "Великая депрессия показала, что стихийные силы природы и экономический хаос могут быть столь же разрушительными, как и война. Создание Администрации Долины Теннесси позволит нам взять под контроль реки региона, развить гидроэнергетику, обеспечить рабочие места и заложить основу для индустриального подъёма."

USA_development_of_the_aluminum_industry: "Развитие алюминиевой промышленности"
USA_development_of_the_aluminum_industry_desc: "Целенаправленное государственное вмешательство в алюминиевую отрасль ускорит индустриализацию, создаст новые рабочие места и заложит фундамент для технологического прогресса. Контроль над производством алюминия станет важным шагом на пути к устойчивой и независимой экономике."

USA_mobilisation_industry: "§YМобилизация промышленности§!"
USA_mobilisation_industry_desc: "Американская промышленность долгое время работала на нужды мирного времени. Однако нарастающая мировая напряжённость требует немедленных мер. Государство должно направить экономику страны на подготовку к возможному конфликту, мобилизовав заводы, ресурсы и рабочую силу ради защиты демократии."

USA_cooperation_with_detroit: "Заключить контракты с Детройтом"
USA_cooperation_with_detroit_desc: "Автомобильные заводы Детройта способны выпускать не только гражданскую продукцию. Государственные заказы и гарантированное финансирование позволят превратить их в основу военного производства, сделав Соединённые Штаты настоящим арсеналом демократии."
USA_general_motors_organization: "«Америкэн Локомотивс»"

USA_cooperation_with_bell: "Заключить контракты с Republic Aviation"
USA_cooperation_with_bell_desc: "Компания Republic Aviation обладает значительным опытом в разработке и производстве современных истребителей. Заключение государственных контрактов позволит ускорить выпуск передовой авиационной техники и укрепить превосходство США в воздухе."
USA_mio_trait_republic_aviation_trait_pressed: "$generic_has_already_completed_this_trait$"
USA_mio_trait_republic_aviation_trait: "Повышенная эффективность бюро"
USA_mio_trait_republic_aviation1_trait: "Поэтапная сборка"
USA_mio_trait_republic_aviation2_trait: "Модули на допп дальность"

USA_the_law_on_production_priorities: "Закон о приоритетах производства"
USA_the_law_on_production_priorities_desc: "В условиях нарастающей угрозы правительство должно получить право перераспределять ресурсы и рабочую силу в пользу оборонной промышленности. Закон о приоритетах производства станет основой эффективной военной экономики."

USA_emergency_shipbuilding_program: "Программа экстренного судостроения"
USA_emergency_shipbuilding_program_desc: "Контроль над морскими путями жизненно важен для безопасности страны. Экстренная программа судостроения обеспечит массовый выпуск кораблей сопровождения и боевых судов, необходимых для защиты торговых маршрутов и флота."

USA_war_time_industry_of_USA: "Промышленность военного времени"
USA_war_time_industry_of_USA_desc: "Соединённые Штаты располагают крупнейшим промышленным потенциалом в мире. Переведя экономику на рельсы военного времени, мы сможем задействовать заводы, ресурсы и рабочую силу по всей стране, превратив Америку в настоящий арсенал демократии и обеспечив победу наших союзников."
USA_war_time_dm: "Последний бой"
USA_war_time_tt: "Изменить §Y$USA_war_time_dm$§! на:"

USA_military_science: "Наука на службе демократии"
USA_military_science_desc: "Победа в современной войне определяется не только численностью войск, но и уровнем технологий. Военная наука США станет фундаментом для создания вооружений, превосходящих любые аналоги противника."

the_manhattan_project: "§YThe Manhattan project§!"
the_manhattan_project_desc: "США берут на себя ответственность за создание оружия, которое может изменить ход войны. Манхэттенский проект объединяет ресурсы, учёных и инженеров для разработки атомной технологии, открывая новую эру вооружений."

USA_war_propaganda_mod: "§YПересмотреть акт о нейтралитете 1935 года§!"
USA_war_propaganda_mod_desc: "Соединённые Штаты приняли законы о нейтралитете, чтобы никогда больше не повторить ошибок Великой войны. Однако мир, который породил эти законы, исчез. Германия и Япония разрушают международный порядок, а американская промышленность уже связана с судьбой демократии за океаном. Пересмотр акта станет первым шагом к отказу от иллюзии."

USA_focus_on_europe_mod: "Поправка акта о нейтралитете"
USA_focus_on_europe_mod_desc: "В Конгрессе идёт ожесточённая борьба между изоляционистами и сторонниками Рузвельта. Поправка позволит продавать оружие европейским демократиям и кредитовать их военные закупки. Это ещё не война, но уже выбор стороны — шаг, который изменит внешнюю политику Америки на десятилетия."
USA_more_effective_isolation_tt: "§YЕсли сейчас мы официально заявим о смене курса страны,сенат повозмущается,но через полгода они успокоятся и начнут нас поддерживать.§!"
USA_conngress_war.1t: "Конфликт интересов в конгрессе"
USA_conngress_war.1d: "Конгресс не доволен новой политикой нашего правительства.Они считают,что мы угрожаем национальной безопастности Америки и поэтому они частично перестанут нас поддерживать."
USA_conngress_war.a: "Обьявить о новой политике нац. обороне Америки"
USA_conngress_war.b: "Ужаться в пользу конгресса"

USA_focus_on_asia_mod: "Политика Карантина"
USA_focus_on_asia_mod_desc: "Агрессор должен быть изолирован так же, как опасная болезнь. Вместо прямого столкновения мы создадим систему эмбарго, дипломатического давления и ограничений на поставки стратегических материалов Японии. Пусть Токио поймёт: дальнейшая экспансия приведёт к экономическому удушению."

USA_focus_special_regime: "Ввести ограниченное чрезвычайное положение"
USA_focus_special_regime_desc: "Президент просит нацию о доверии. Государству нужны дополнительные рычаги для контроля над транспортом, сырьём и оборонными заказами. Мера временная, но она подготовит экономику к резкому развороту в сторону военных нужд."

USA_giant_gets_sexy: "§RГигант пробуждается§!"
USA_giant_gets_sexy_desc: "Десятилетие депрессии усыпило уверенность американцев, но в недрах страны зреет небывалая сила. Заводы, университеты и миллионы рабочих рук готовы к великому рывку. Вопрос лишь в том, кто направит эту мощь — политики старого мира или новое поколение лидеров."

USA_global_potential: "§YГлобальный Потенциал§!"
USA_global_potential_desc: "Америка больше не может быть просто богатой провинцией планеты. Наши технологии, флот и доллар создают систему, от которой зависит половина мира. Признав это, мы перестанем мыслить категориями континента и начнём мыслить категориями планеты."
usa_potanzeval: "Глобальный потенциал"

USA_supp_china: "§2Начать поддержку Китая§!"
USA_supp_china_desc: "Китай держится на пределе возможностей, но его сопротивление связывает сотни тысяч японских солдат. Поставки оружия, медикаментов и кредитов превратят далёкую войну в щит для американских интересов на Тихом океане."

USA_war_attache: "Военное атташе в Китай"
USA_war_attache_desc: "Наши офицеры должны увидеть будущего противника в деле. Отчёты атташе помогут понять тактику Императорской армии, слабости японской авиации и реальные возможности китайских союзников."
usa_attache_tt: "Добавлять §H0.25§! £doctrine_mastery §Hочк. освоения§! ежедневно в течение §H250§! дн. для всех направлений из списка:\n- В папке: §HСухопутная доктрина§!\n- С главной доктриной: §HБольшой план операции§!\n- Следующего типа: §HПехота§!"
CHI_USA_attache: "Атташе из Америки"

USA_get_air_to_china: "Поставка авиации в Китай"
USA_get_air_to_china_desc: "Без господства в воздухе Китай обречён. Американские истребители и инструкторы создадут ядро новой китайской авиации, а добровольцы станут символом неофициальной войны против Токио."
decision_cost_air_150: "£army_air_superiority_texticon §Y150§!"
decision_cost_air_150_blocked: "£army_air_superiority_texticon §R150§!"
USA_lend_lease_supp_air: "Поставка авиации в Китай"

USA_national_cometee_of_defence: "Сформировать национальной комитет обороны"
USA_national_cometee_of_defence_desc: "Америка входит в новую эпоху, но её государственный механизм всё ещё настроен на мир. Армия и флот спорят о приоритетах, бизнес ищет гарантий, а Конгресс опасается военной паники. Начальный комитет обороны объединит военных, промышленников и профсоюзы для единого плана перевооружения."
USA_pentagon: "Управление военного производства"
USA_PENTAGON_TT: "Изменить §Y$USA_pentagon$§! на:"

USA_rubber_programm: "Программа расширения каучуковых производств"
USA_rubber_programm_desc: "Почти весь натуральный каучук находится под контролем Японии и колониальных держав. Если поставки прекратятся, остановятся грузовики и самолёты. Синтетический каучук станет стратегическим оружием Америки."

USA_USAGE: "Проекты USACE"
USA_USAGE_desc: "Инженерный корпус армии превратит географию в инструмент войны: новые дамбы дадут энергию заводам, дороги свяжут континент, а аэродромы подготовят небо для тысяч самолётов."

USA_NO_LIMIT_WAR: "§YВвести неограниченное чрезвычайное положение§!"
USA_NO_LIMIT_WAR_desc: "Настал момент признать очевидное: страна фактически находится в состоянии войны, даже если Конгресс ещё не объявил её. Государство возьмёт под контроль рабочую силу, цены и распределение ресурсов."

USA_war_prod_cometee: "Создать совет по военному производству"
USA_war_prod_cometee_desc: "Бизнес привык к конкуренции, но война требует планирования. Совет распределит заказы, устранит дублирование и превратит хаос контрактов в единую машину снабжения."

USA_chensay_military: "§GКейнсианский милитаризм§!"
USA_chensay_military_desc: "Пушки станут лекарством от депрессии. Государственные расходы на вооружение создадут миллионы рабочих мест и окончательно выведут экономику из кризиса, пусть и ценой милитаризации."

USA_Arsenal_of_democrasy_mod: "§YАрсенал Демократии§!"
USA_Arsenal_of_democrasy_mod_desc: "Пусть другие сражаются на фронтах - Америка станет кузницей их победы. Каждый танк и каждый самолёт, сошедший с конвейера, приблизит день, когда свобода восторжествует."

USA_price_controll: "Введение контроля цен"
USA_price_controll_desc: "Военные заказы уже разгоняют инфляцию. Если не остановить рост цен, социальный взрыв станет опаснее любого врага. Экономика должна подчиниться дисциплине."

USA_war_vets: "Коммисия по военным кадрам"
USA_war_vets_desc: "Опыт Первой мировой показывает: победа зависит не только от численности, но и от подготовки. Комиссия создаст систему обучения офицеров, техников и управленцев военного времени."

USA_war_mob: "Закон о военной мобилизации"
USA_war_mob_desc: "Добровольческая Америка уходит в прошлое. Закон вводит систему призыва, распределяет рабочую силу между фронтом и заводами, подчиняет транспорт военным нуждам. Это тяжёлый удар по традициям, но без него армия останется бумажным тигром."

USA_law_of_war_time: "Закон о полномочиях военного времени"
USA_law_of_war_time_desc: "Конгресс передаёт исполнительной власти полномочия, о которых в мирные годы не могло быть и речи: реквизиция предприятий, контроль над забастовками, управление железными дорогами. Демократия рискует ради собственного спасения, надеясь вернуть свободы после победы."

USA_press_censenship: "Цензура прессы"
USA_press_censenship_desc: "Американская журналистика гордится своей независимостью, но война превращает слова в оружие. Военные требуют не раскрывать маршруты конвоев и потери флота, правительство — сдерживать панические слухи. Начинается тонкая игра между безопасностью и Первой поправкой."

USA_informational_war: "Информационная Война"
USA_informational_war_desc: "Пропаганда больше не ругательство, а государственная необходимость. Голливуд снимает фильмы о героях, радиостанции вещают на десятках языков, художники рисуют плакаты для заводов. Америка должна не только производить оружие, но и формировать волю к его использованию."

USA_talks_with_brit: "Переговоры с Великобританией"
USA_talks_with_brit_desc: "Британская империя сражается в одиночку, и её судьба всё сильнее зависит от Вашингтона. Тайные встречи адмиралов и генералов определяют будущие зоны ответственности. Формально мы нейтральны, фактически — уже строим общую стратегию."
no_allies_cry_bitch: "§YВ случае отказа со стороны Англии вся ветка будет заблокирована§!"

USA_allience.1t: "Америка просится в Союзники"
USA_allience.1d: "Недавно Соединненые Штаты Америки попросились к нам в альянс.С одной стороны США очень сильная страна,способная экономически помочь нашему альянсу.С другой стороны они могут попытаться оспорить наше лидерство и попытатся занять наше место."
USA_allience.a: "Америка будет хорошим дополнением к нашему альянсу"
USA_allience.b: "Скажем нет США"
no_usa_with_us_tt: "§RАмерика не сможет вступить в альянс к нам и у нее заблокируется все ветка§!"

USA_enter_alliance: "§GВступление в Союзники§!"
USA_enter_alliance_desc: "После долгих сомнений нация делает выбор. Речь идёт не только о военном договоре, но о моральном самоопределении: Америка признаёт, что её безопасность неотделима от судьбы мира."

USA_war_centers: "Объединение штабов с Великобританией"
USA_war_centers_desc: "Две державы учатся воевать как единое целое. Общие коды, единые карты операций, распределение конвоев и флотов — рождение англо-американской военной машины."
usa_and_eng_MOD: "«Военно-промышленное бюро»"
MOD_TRAIT: "Промышленный гигант"
usa_and_eng_MOD_TT: "Открывает промышленный концерн §Y$usa_and_eng_MOD$§!"

USA_war_cabinet_operation: "§YУправление стратегических служб§!"
USA_war_cabinet_operation_desc: "Тихая война выходит на первый план. Новая служба займётся тем, что не вписывается в уставы: поддержкой сопротивления, диверсиями, работой с эмигрантами и учёными-беженцами."

USA_war_cabinet_operations: "Операция черный кабинет"
USA_war_cabinet_operations_desc: "Ещё со времён Первой мировой Америка умела читать чужие телеграммы. Теперь эта практика станет системной: криптографы и лингвисты превратятся в солдат невидимого фронта."

USA_pay_and_get: "Заплати и уноси"
USA_pay_and_get_desc: "Формула «cash and carry» позволяла сохранять лицо нейтралитета. Но каждый новый контракт всё сильнее связывает нас с войной, а порты превращаются в перевалочные базы союзников."
decision_cost_INF_2500: "£GFX_eng_go_and_get_texticonn £infantry_equipment_text_icon §Y3500§!"
decision_cost_INF_2500_blocked: "£GFX_eng_go_and_get_texticonn £infantry_equipment_text_icon §R3500§!"

