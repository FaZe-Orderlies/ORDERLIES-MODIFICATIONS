 Greater_ITA: "§YЮгославия§!, §YГреция§! и §YАлбания§! будут навеки включены в состав Итальянской Империи. Все их территории станут §Yнациональными землями§! Италии, а их народы займут достойное место под знаменами Рима."
 peace_training: "Тренировка в мирное время"
 FRA_magino: "Линия Мажино"
 JAP_strike_south: "§YЯпония§! начинает экспансию на юг. Армии Империи направят свой удар в §YЮго-Восточную Азию§!, стремясь установить японское господство над богатствами и стратегическими территориями региона. §RЯпония начнёт войну с Союзниками!§!"
 orderlies_defeatism: "Пораженчество"
 orderlies.5.t: "Советский Союз аннексирует Бессарабию"
 orderlies.5.d: "После предъявления Румынии ультиматума Советский Союз потребовал возвращения Бессарабии, считая её территорией, отторгнутой от России в период Гражданской войны. Не имея возможности оказать серьёзное сопротивление и оставшись без поддержки своих союзников, румынское правительство было вынуждено принять советские требования.\n\n28 июня части Красной армии перешли румынскую границу и начали занятие Бессарабии. Румынская администрация и войска приступили к отступлению, оставляя территорию под контроль СССР.\n\nБессарабия вновь оказалась под властью Москвы."
 orderlies.5.a: "Впечатляет"
 orderlies.6.t: "Падение Советского Союза"
 orderlies.6.d: "Операция «Барбаросса», начавшаяся 22 июня 1941 года, увенчалась полным успехом. Германские армии прорвали советские оборонительные линии, сокрушили основные силы Красной армии и завершили кампанию на востоке победой. \n\nСоветская власть, ещё недавно стремившаяся распространить коммунизм на всю Европу, теперь пала под ударами германского оружия. Над огромными территориями Востока установился новый порядок, а последние очаги организованного сопротивления были подавлены.\n\nВосточный фронт пал. Операция «Барбаросса» увенчалась успехом!\n\nГермания одержала величайшую победу в своей истории."
 orderlies.6.a: "Новый мировой порядок?"
 orderlies.7t: "Капитуляция Японии"
 orderlies.7d: "Императорская Япония признаёт поражение. Годы тотальной войны истощили промышленность страны: верфи стоят без стали, а некогда грозный флот покоится на дне Тихого океана. Гарнизоны на разбросанных островах отрезаны от метрополии и лишены снабжения, материковые армии увязли в войне на истощение.\n\nВ императорском дворце решение принято. Голос Тэнно, обращённый к нации, объявляет о безоговорочной капитуляции. Оружие складывается, а над крепостями Восточной Азии и Тихого океана поднимается белый флаг. Эпоха имперской экспансии подходит к концу."
 orderlies.7.a: "Впечатляет"
 orderlies_swaptech: "Orderlies swaptech"
 orderlies_swaptech_desc: " "

 asia_resource_monetka: "Триумф в Юго-Восточной Азии"
 asia_resource_collapse_idea: "Крах в Юго-Восточной Азии"

 orderlies.8.t: "Триумф в Юго-Восточной Азии"
 orderlies.8.d: "Оборона Союзников в Юго-Восточной Азии окончательно рухнула. После ожесточенных боев за бастионы Малайи, богатейшие нефтяные промыслы Суматры и бескрайние каучуковые плантации Голландской Ост-Индии перешли под полный контроль Японской империи. Отрезанные от жизненно важных ресурсов британские и американские гарнизоны капитулировали, а стратегическая инициатива на Тихоокеанском театре военных действий перешла в руки Токио.\n\nПадение этого ключевого региона открывает японскому флоту свободный путь в Индийский океан, создавая прямой угрозою коммуникациям Британской империи и ставя под удар австралийские доминионы. Союзникам предстоит тяжелейшая борьба за возвращение утраченных позиций."
 orderlies.8.a: "Отличные новости для Империи"



 GER_totaler_krieg_r: "§YВыполняется хотя бы одно условие:§!\n - §WДата позже§! §Y1 декабря 1942§!\n - §WЯпония потерпела поражение в Азии§!\n - §WИталия не контролирует §RСицилию§! или §RСардинию§!§!\n - §WОдна из стран-союзниц не контролирует свою столицу§!\n - §RВраг вступил на национальные территории Германии§!\n - §RСоюзники высадились в Западной Европе§!"

