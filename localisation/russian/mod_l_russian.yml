JAP_annex_CHI: "§YНаши требования поставят китайское правительство перед неизбежным выбором.§!\n\nКитай будет обязан §Rвойти в состав Японской империи§!."
JAP_new_government: "Начнётся масштабная программа интеграции и развития новых имперских территорий.\n\n§YКлючевые города Китая получат модификатор§! §G«Инвестиции из Токио»§!, §Yувеличивающий скорость строительства на 5%§!. Кроме того, §Yкоренное население будет постепенно замещаться японскими переселенцами§!, что укрепит контроль Империи над регионом."
JAP_annex_SIA: "§YСудьба Сиама будет окончательно решена.§!\n\n§RКоролевство Сиам будет аннексировано Японской империей.§!"
FRA_invade_syria_cust: "§YНастало время вернуть Сирию под французский флаг.§!\n§RНи один ставленник держав Оси не удержится на этой земле.§!"
FRA_invade_west_africa_cust: "§YМы восстановим французское господство в Западной Африке.§!\n§RВласть Вишисткого режима будет уничтожена, а французский триколор вновь взовьется над колониями.§!"
FRA_invade_madagascar_cust: "§YФранция вернет Мадагаскар под свой контроль.§!\n§RПоследние оплоты сотрудничавших с державами Оси сил будут сокрушены.§!"
