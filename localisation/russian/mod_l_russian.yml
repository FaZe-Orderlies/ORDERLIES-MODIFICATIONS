 orderlies.2.t: "Силы стран Оси были вытеснены с Северной Африки"
 orderlies.2.d: "Войска Союзников окончательно вытеснили силы Оси из Северной Африки, восстановив контроль над всем регионом. После долгих месяцев ожесточенных боев стратегическая инициатива на африканском театре окончательно перешла в руки союзного командования.\n\nВозвращение портов, складов, железнодорожных узлов и промышленных предприятий позволит значительно укрепить снабжение войск и расширить возможности для дальнейших операций. Освобожденная инфраструктура уже приводится в порядок, а местные ресурсы будут направлены на поддержку военных усилий Союзников и подготовку новых наступлений."
 orderlies.2.a: "Это шокирует"
 orderlies.1.t: "Триумф в Египте"
 orderlies.1.d: "После продолжительной кампании войска Оси установили полный контроль над Египтом. Потеря этой стратегически важной территории стала тяжелым ударом по британским позициям на Ближнем Востоке и поставила под угрозу снабжение союзников через Суэцкий канал - одну из важнейших транспортных артерий региона.\n\nЗахваченные порты, склады, железнодорожные узлы и промышленные предприятия открывают новые возможности для снабжения войск и дальнейшего развития наступления. Закрепив успех, командование намерено как можно скорее восстановить работу местной инфраструктуры и направить ее ресурсы на обеспечение военных нужд."
