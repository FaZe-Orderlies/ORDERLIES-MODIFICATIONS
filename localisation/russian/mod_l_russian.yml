FRA_fraspain1_desc: "Объединённая бурбонская монархия готова к новым династическим притязаниям. Мы укрепим армию, реорганизуем управление и создадим инфраструктуру, необходимую для будущих территориальных кампаний. Бурбоны вновь поднимут свой стяг над унаследованными землями Европы."
FRA_fraspain2_desc: "Португалия исторически находилась в сфере влияния испанской короны. Пришло время завершить интеграцию Иберийского полуострова под единым бурбонским управлением. Мы предъявим претензии, оправданные династической преемственностью, и включим португальские земли в наше государство."
FRA_fraspain3_desc: "Старое владение Габсбургов, некогда контролируемое испанской короной, по праву принадлежит вновь объединённой империи Бурбонов. Мы восстановим наше влияние в регионе, обеспечим присутствие армии и претворим в жизнь династические притязания на север."
FRA_fraspain4_desc: "Исторические территории короны Арагона и дома Савойя представляют значимую часть бурбонских притязаний в Италии. Мы укрепим свои позиции, вмешаемся в региональные дела и подготовим условия для возвращения этих земель под наш контроль."
FRA_fraspain5_desc: "После объединения двух корон и восстановления исторических владений начинается новая эпоха бурбонского величия. Наше государство вновь становится доминирующей силой католической Европы, претендуя на место великой монархической державы."
FRA_fraspain6_desc: "Соединение двух корон требует твёрдой руки. Мы укрепим государственные институты, подчиним непокорные регионы, ликвидируем центры сопротивления и централизуем власть вокруг бурбонского престола. Новая монархия не потерпит раздробленности."
FRA_fraspain7_desc: "Католическая вера, верность родине и преданность королю образуют священный тройственный принцип, на котором будет стоять наше государство. Мы возродим союз алтаря и трона, подчинив духовные и политические силы служению монархии."
FRA_fraspain8_desc: "Бурбонская монархия опирается на устои старого порядка - религию, честь, дисциплину и социальную иерархию. Эти ценности станут основой идеологического возрождения и укрепят верность народа трону, создавая устойчивую основу для будущих реформ."
FRA_fraspain9_desc: "Сочетая традиционные институты с современными методами управления, мы создаём обновлённую форму монархического консерватизма. Государственный аппарат будет укреплён, элиты перестроены, а общество — направлено к дисциплине и общему национальному долгу."
FRA_benelux_desc: "Франция предъявит претензии на регионы с франкоязычным населением, восстановив влияние в Бельгии и Люксембурге и защитив там своих братьев по культуре."
FRA_new_french_domination_desc: "Мы усилим французское влияние в Бенилюксе и обеспечим культурное и политическое доминирование франкофонов как основы нового регионального порядка."
FRA_war_on_switzerland_desc: "Швейцария препятствует нашему стратегическому превосходству в Альпах. Мы подготовим операцию, чтобы устранить её нейтральный барьер и установить контроль над регионом."
FRA_use_switzerland_banks_desc: "После захвата страны мы перенаправим швейцарские финансовые и промышлен­ные ресурсы на усиление французской экономики и поддержку наших военных планов."
FRA_solo_desc: "Франция становится лидером латинского мира и берёт на себя роль главной силы союза. Мы направим Португалию, Испанию и Италию к общим целям и укрепим взаимную поддержку в грядущих конфликтах."
FRA_religion_desc: "Католическая вера вновь становится идеологической опорой государства. Союз церкви и власти обеспечит единство нации и укрепит моральные устои режима."
FRA_war_on_anatolia: "Пересмотр границ в Анатолии"
FRA_the_congress_of_paris_desc: "Латинская Антанта соберётся в Париже, чтобы согласовать план совместного наступления на Германию и Нидерланды. Координация действий укрепит единство союза."
FRA_the_natural_borders_of_france_desc: "Франция заявит права на Бельгию, Брабант и земли по Рейну, стремясь вернуть свои исторические рубежи и восстановить стратегическую безопасность северных границ."
FRA_war_on_anatolia_desc: "Средиземноморье слишком долго находилось в состоянии хрупкого равновесия. Теперь Франция и Италия решили изменить баланс сил в свою пользу. Объединив свои армии и флот, они готовятся к крупной операции против Турции, рассчитывая закрепить своё влияние в регионе и открыть новую эпоху европейской доминации."
