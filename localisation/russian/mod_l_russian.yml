JAP_annex_CHI: "§YНаши требования поставят китайское правительство перед неизбежным выбором.§!\n\nКитай будет обязан §Rвойти в состав Японской империи§!."
JAP_new_government: "Начнётся масштабная программа интеграции и развития новых имперских территорий.\n\n§YКлючевые города Китая получат модификатор§! §G«Инвестиции из Токио»§!, §Yувеличивающий скорость строительства на 5%§!. Кроме того, §Yкоренное население будет постепенно замещаться японскими переселенцами§!, что укрепит контроль Империи над регионом."
