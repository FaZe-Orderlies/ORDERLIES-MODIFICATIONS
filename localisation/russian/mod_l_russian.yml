FRA_appeal_to_overseas_territories_resources_cust: "Когда метрополия пала во тьму, именно свободная земля Африки протянула нам руку помощи и зажгла §Yпламя Сопротивления§!. Пришло время отплатить за верность: эти территории официально признаются §Gинтегральной и неделимой частью Свободной Франции§!, а их ресурсы будут полностью мобилизованы для §Rосвобождения Парижа§!!"
