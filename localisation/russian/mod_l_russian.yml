 news.1000.t: "Операция Факел"
 news.1000.d: "Сегодня англо-американские войска начали крупнейшую десантную операцию на Средиземноморском театре военных действий. Союзные силы высадились в Марокко и Алжире, находившихся под контролем режима Виши. Несмотря на отдельные очаги сопротивления, большая часть французских войск оказалась не готова к продолжительной борьбе. Захват Северной Африки открывает союзникам путь к Тунису и создает непосредственную угрозу итальянским и германским позициям в регионе."
 news.1000.a: "Северная Африка станет новым полем битвы."
 USA_TORCH: "§HОперация «Факел» §!§YСоединённые Штаты§! и их союзники начнут масштабную высадку в Северной Африке.Экспедиционные силы займут плацдармы в Марокко и Алжире.В Средиземноморье откроется §ВВторой фронт§!."
 KITAI_attache: "Атташе в Китай"
 ispanka: "Атташе в Испанию"
 North_africa_company: "Североафриканская кампания"
