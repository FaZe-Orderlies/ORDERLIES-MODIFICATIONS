FRA_fraspa_nac1: "§YВсе земли YИспанииD02! на Пиренейском полуострове станут нашими Gнациональными территориями!.§!\nДве короны вновь сходятся на челе 2БурбоновFRA!, а Пиренеи перестают быть tграницей!."
FRA_fra_rhein1: "§YYБельгияBEL!, 4ЛюксембургLUX!, 9БрабантHOL! и всё по gРейнуRHI! будут признаны нашими Gнациональными территориями!.§!\nМы восстанавливаем естественные пределы BФранцииFRA!от YФландрииBEL! до gРейнаRHI!, от 3морей! до Rбастионов! 2Европы!"
