 ## ЛЕЙТ-ФОКУСЫ ТОТАЛЬНОЙ ВОЙНЫ ГЕРМАНИИ
 GER_total_war_propaganda: "Тотальная война"
 GER_total_war_propaganda_desc: "Война вступила в решающую фазу. Все силы нации — промышленность, ресурсы и люди — должны быть брошены на достижение победы."
 GER_volkssturm: "Фольксштурм"
 GER_volkssturm_desc: "Последний резерв рейха. Ополчение из стариков и подростков встанет под ружьё ради защиты Германии."
 GER_reichsverteidigung: "Имперская оборона"
 GER_reichsverteidigung_desc: "Земля Рейха должна быть превращена в крепость. Укрепления, эшелонированная оборона и стойкость войск остановят любого врага."
 GER_ostfront_directives: "Директивы Восточного фронта"
 GER_ostfront_directives_desc: "Генштаб завершает разработку директив кампаний против Советского Союза. Открывает восточные оперативные планы."
 GER_westfront_directives: "Директивы Западного фронта"
 GER_westfront_directives_desc: "Генштаб разрабатывает планы кампаний на западе Европы. Открывает западные оперативные планы."
