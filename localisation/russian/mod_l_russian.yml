FRA_old_good_capitalism: "Старый добрый капитализм"
FRA_old_capitalism: "Новый буржуазный Порядок"
FRA_back_to_benelux: "Вернуть себе нижние земли"
FRA_attack_switzerland_desc: "Швейцария превратилась в рассадник смуты у самых наших границ. Чтобы защитить Францию и вернуть порядок в Альпы, мы должны взять её будущее в свои руки. Стабильность и влияние Франции требуют решительности."
FRA_back_to_benelux_desc: "Бенилюкс стоит на пути нашего возвращённого величия. Эти малые государства либо станут щитом Франции, либо — вратами для наших врагов. Решив вопрос силой и волей, мы укрепим север и восстановим наше историческое превосходство."
FRA_claims_on_catalonia_desc: "Каталония устала ждать свободы и смотрит к северу, на Францию — защитницу прогресса и порядка. Если мы поддержим её стремления, Пиренеи снова станут линией, определяющей силу Франции, а не слабость Испании."
FRA_back_to_italy_desc: "Пьемонт — земля, где французская история и культура звучат громче любых итальянских притязаний. Италия отвернулась от разума и свободы, и мы обязаны вернуть то, что по праву принадлежит Франции. Пьемонт должен вновь служить бастионом нашего величия."
FRA_fra_eng_together_desc: "Германия снова поднимается, и Европа дрожит. Старые распри между Парижем и Лондоном теряют смысл перед лицом великой угрозы. В союзе с Британией Франция вновь станет стержнем Европы — и вместе мы остановим германский натиск."
FRA_new_napoleon_army_desc: "Франции вновь нужна армия, которой будут бояться на всех континентах. Настало время возродить наполеоновский дух — дисциплину, решимость и непоколебимую веру в победу. Мы создадим силу, равной которой не знала современная Европа: армию, способную к молниеносным походам, смелым манёврам и безусловному триумфу."
FRA_napoleon_army: "Новая Наполеоновская Армия"
fra_congress: "RМы согласуем с GITAИталией!, HSPRИспанией! Rи POR7Португалией! Rсовместную стратегию и начнём наступление вглубь gGERГерманииR.!"
FRA_start_offensive: "Спланированное наступление на Германию"
FRA_use_swiss_gold: "Использование швейцарских золотых запасов"
FRA_french_domination: "Новое французское превосходство"
fra_anatolia: "2FRAФранция! и GITAИталия! 7согласуют совместную позицию по пересмотру границ! в tTURАнатолии!."
FRA_create_industrial_chartes_desc: "Чтобы укрепить национальную экономику, нужны новые правила, новые союзы и новая ответственность. Промышленные хартии объединят рабочие коллективы и предпринимателей под единым государственным руководством, создавая дисциплину и порядок на производстве. Так мы сформируем промышленный каркас будущей мощи Франции."
FRA_ask_for_support_from_bourgeoisie_desc: "Чтобы укрепить государство и направить Францию к величию, нам необходимо заручиться поддержкой тех, кто владеет капиталом, влиянием и опытом. Объединившись с буржуазией, мы создадим союз, способный преобразовать экономику и дать стране новые силы. Путь к мощи Франции начинается с согласия её ведущих классов."
FRA_restoration_of_the_nobility_desc: "Франции нужна опора на свои древние элиты. Возрождая дворянство, мы укрепляем государственную традицию, возвращаем уважение к власти и создаём новый столп монархического порядка. Старые роды снова служат Франции — верно, гордо и непреклонно."
FRA_the_triumph_of_the_bourgeois_order: "Пора открыть путь тем, кто движет Францию вперёд — промышленникам, банкирам и предпринимателям. Новое буржуазное возрождение объединит энергию капитала и силу государства, чтобы построить экономику, способную конкурировать с любым соперником. Франция поднимется на плечах своего труда и своего разума."
FRA_neokonservatism: "Французский неоконсерватизм"
FRA_dios_patria_rey: "Бог,Отечество,король"
FRA_consolidation_power: "Консолидированная власть"
FRA_traditional: "Традиционные ценности"
FRA_old_and_good_capitalism: "Старый добрый капитализм"
FRA_destroy_belguim_desc: "Мы больше не намерены терпеть существование слабой Бельгии на наших границах. Исторический момент требует решительных действий: французская армия готова пересечь границу и вернуть эти земли в сферу французской короны. Бельгийский вопрос будет решён раз и навсегда — под нашими знаменами."
USA_decolonization_ocean: "Деколонизация наших Тихоокеанских владений"
USA_arsenal_of_democracy: "Арсенал Демократии"
USA_anti_capitalism: "Закон на накопленное богатство"
fra_congress.1t: "Конгресс Латинской Антанты"
fra_congress.1d: "Тучи над Европой сгущаются. В Париже срочно был созван Конгресс Латинской Антанты, чтобы обсудить стремительный рост германской мощи. Анализ ситуации показал: в одиночку ни одна страна не сможет противостоять надвигающейся угрозе. Участники конгресса приняли трудное, но неизбежное решение - объединить стратегическое планирование и подготовиться к масштабному военному противостоянию. Возможно, именно здесь, в столице Франции, решается судьба континента."
fra_congress.a: "Пора приступить к выполнению плана!"
fra_anatolia.1t: "Судьба Анатолии"
fra_anatolia.1d: "Сегодня Франция направила в Рим неожиданную, но чрезвычайно заманчивую инициативу. Париж предлагает вместе перекроить Анатолию, разделив её на зоны интересов и навсегда изменив судьбу региона. Такой шаг может значительно усилить влияние обеих держав, но также сулит риски и обострение конфликтов. Италия стоит перед выбором: поддержать план и вступить в смелую игру или отвергнуть предложение, избрав спокойный и безопасный путь."
fra_anatolia.a: "Несмотря на дальнейшее решение Италии мы начнем захват Анатолии"
fra_with_eng.1t: "Наполеон VI предлагает объединится против Германии"
fra_with_eng.1d: "Наполеон VI направил в Лондон письмо, в котором прямо заявлено: «Франция и Великобритания много раз сталкивались друг с другом, но сегодня нашим странам грозит общий враг». Император обращается к британскому правительству с предложением забыть вековые противоречия и объединиться против Германии. Париж предлагает взаимные гарантии, военное сотрудничество и дипломатическую поддержку. Теперь Лондон должен выбрать - опереться на Францию или отвергнуть протянутую руку."
fra_with_eng.a: "Пожалуй нам стоит забыть старые обиды"
fra_with_eng.b: "Мы отказываемся от предложения Французского Императора"
