 FRA_integrate_conquered_territories: "Включить в состав регион в состав бурбонских владений"
 FRA_integrate_conquered_territories_desc: "Завоёванные территории должны быть полностью интегрированы в состав Французской Империи. Мы установим французское управление, культуру и язык, чтобы укрепить нашу власть и обеспечить лояльность новых подданных. Это позволит нам создать единое и сильное государство, способное противостоять любым внешним угрозам."
 FRA_core_conquered_state: "Включить регион «[FROM.GetName]» в состав владений Бурбонов"
 FRA_core_conquered_state_desc: "Завоёванные территории исторически принадлежат дому Бурбонов и должны быть официально признаны частью нашей империи. Мы утвердим наши династические права на [FROM.GetName], обеспечив их полную интеграцию в государственную структуру Франции. Это укрепит наше влияние и создаст прочную основу для будущих поколений."
 FRA_new_bourbon_era_tt: "Открывает доступ к решениям по §Yинтеграции завоёванных территорий§!, что позволит нам заявить о §Hдинастических правах Бурбонов§! на §Bевропейские земли§! и превратить их в §Gнациональные регионы§! §2Французской Империи§!."
 FRA_back_to_benelux_tt: "Пришло время исправить ошибки прошлого и вернуть §BНижние земли§! под прямой контроль Парижа, объявив Бенилюкс национальным. §YИнтеграция завоёванных территорий§! сотрет границы, мешающие величию §2Французской Империи§!."
 FRA_claims_on_catalonia_tt: "Пиренеи больше не будут преградой для нашей воли. Мы утвердим §Bфранцузское господство§! на полуострове, превратив Каталонию в §Gнациональную территорию§! великой §2Империи§!, а в ненационализированных территориях £compliance_gain_texticon£§40.25%§! испанцев каждый день будут подчинятся нашей власти."
 FRA_attack_switzerland_tt: "Альпы должны служить щитом Франции, а не укрытием для наших врагов. §BШвейцарские перевалы§! перейдут под контроль Великой Армии, а ежедневно £compliance_gain_texticon£§40.25%§! населения§! будет переходить на сторону §2нашей власти§!, обеспечивая стратегическое доминирование §2Империи§!."
 FRA_back_to_italy_tt: "Пьемонт — ключ к контролю над Северной Италией. Мы заявим о §Bфранцузских правах§! на этот регион, превратив его в §Gнациональную территорию§!."
 FRA_fraspain3_tt: "Франция восстановит своё влияние в Бенилюксе, захватив его и улучшив местную администрацию. Ежедневно £compliance_gain_texticon£§40.25%§! населения будет переходить на сторону §2нашей власти§!."
 FRA_fraspain_4_tt: "Мы утвердим §Bфранцузское господство§! в Северной Италии и Ижной Италии, превратив Неаполь и Пьемонт в §Gнациональные территории§! великой §2Империи§!."
 FRA_fraspain2_tt: "Португалия исторически находилась в сфере влияния испанской короны. Пришло время завершить интеграцию Иберийского полуострова под единым бурбонским управлением. Мы предъявим претензии, оправданные династической преемственностью, и включим португальские земли в наше государство, ежедневно £compliance_gain_texticon£§40.25%§! населения будет переходить на сторону §2нашей власти§!."

