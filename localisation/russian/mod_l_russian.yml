FRA_magino: "Линия Мажино"
JAP_strike_south: "§YЯпония§! начинает экспансию на юг. Армии Империи направят свой удар в §YЮго-Восточную Азию§!, стремясь установить японское господство над богатствами и стратегическими территориями региона. §RЯпония начнёт войну с Союзниками!§!"
orderlies_defeatism: "Пораженчество"
orderlies.5.t: "Советский Союз аннексирует Бессарабию"
orderlies.5.d: "После предъявления Румынии ультиматума Советский Союз потребовал возвращения Бессарабии, считая её территорией, отторгнутой от России в период Гражданской войны. Не имея возможности оказать серьёзное сопротивление и оставшись без поддержки своих союзников, румынское правительство было вынуждено принять советские требования.\n\n28 июня части Красной армии перешли румынскую границу и начали занятие Бессарабии. Румынская администрация и войска приступили к отступлению, оставляя территорию под контроль СССР.\n\nБессарабия вновь оказалась под властью Москвы."
orderlies.5.a: "Впечатляет"
orderlies.6.t: "Падение Советского Союза"
orderlies.6.d: "Операция «Барбаросса», начавшаяся 22 июня 1941 года, увенчалась полным успехом. Германские армии прорвали советские оборонительные линии, сокрушили основные силы Красной армии и завершили кампанию на востоке победой. \n\nСоветская власть, ещё недавно стремившаяся распространить коммунизм на всю Европу, теперь пала под ударами германского оружия. Над огромными территориями Востока установился новый порядок, а последние очаги организованного сопротивления были подавлены.\n\nВосточный фронт пал. Операция «Барбаросса» увенчалась успехом!\n\nГермания одержала величайшую победу в своей истории."
orderlies.6.a: "Новый мировой порядок?"


