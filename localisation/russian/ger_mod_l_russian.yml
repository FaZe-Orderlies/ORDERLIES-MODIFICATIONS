l_russian:


GER_fate_of_yugoslavia_custom: "§YЮгославия будет расчленена.§! Каждая из стран Оси получит обещанные ей территории."
GER_fate_of_greece_custom: "§YОперация «Марита» обеспечит контроль над Грецией.§! В соответствии с предварительными договорённостями Италия и Болгария получат предназначенные им территории."
######ЭКОНОМИКА НОВЫЙ#################
GER_expand_the_reichsautobahn_east_tt: "Добавит максимум §Yинфраструктуры§! в §YСаксонии§!, §YВосточной Марки§!, §YНидершлезиенге§! и §YОбершлезиене§!"
GER_expand_the_reichsautobahn_south_tt: "Добавит максимум §Yинфраструктуры§! в §YБадене§!, §YВюртемберге§!, §YВерхней Баварии§! и §YНижней Баварии§!"
GER_barbarossa_fate_of_the_reich_tooltip: "§R[Борьба за жизнь Рейха]§!\n\n«Этот час решит судьбу §YНемецкой Нации§! на грядущие §Wтысячелетия§!! Великое столкновение двух миров неизбежно, и в нем §Rне может быть компромиссов§!.\n\nЛибо §YВеликогерманский Рейх§! навсегда сокрушит смертельную угрозу на Востоке, либо мы падем под натиском §Rбольшевистских орд§!.\n\nВся история нашего народа вела к этой §Wрешающей битве§!. Каждый немецкий солдат, каждый танк и каждое орудие теперь подчинены одной священной цели: §Gвырвать Великую Победу§! и утвердить §Yвечное господство Рейха§!»"

######НОВАЯ ВЕТКА: ВОЙНА С СССР + ТОТАЛЬНАЯ ВОЙНА#################
totaler_krieg_mobilisation: "§RTotale Mobilmachung§!"
totaler_krieg_mobilisation_desc: "§YТотальная мобилизация§! экономики: ускорение военного строительства, рост эффективности производства и снижение затрат на потребление."
GER_totaler_krieg_mobilisation_tt: "§YТотальная война§! переводит экономику на военные рельсы: §G+30%§! скорость строительства военных зданий, §G+10%§! оборона и атака на территории, §G+10%§! рост эффективности производства, §G-15%§! затраты на потребительские товары."

GER_speer_eastern_armaments: "Вооружения Шпеера"
GER_speer_eastern_armaments_desc: "Альберт Шпеер направляет министерство вооружений на обеспечение Восточного фронта: производственные мощности растут, а новые оружейные заводы встают по всему Рейху."
GER_eastern_wall: "Восточный вал"
GER_eastern_wall_desc: "Возведение мощной линии укреплений и бункеров на границе с Советским Союзом для сдерживания большевистского натиска."
GER_eastern_wall_tt: "§YВосточный вал§!: в каждой приграничной с СССР провинции возводятся §Gбункеры§! (5 уровень)."
GER_operation_blau: "Операция «Блау»"
GER_operation_blau_desc: "Наступление на южном крыле Восточного фронта с целью захвата кавказской нефти. Ускорение промышленных исследований и приток нефти."
GER_operation_citadel: "Операция «Цитадель»"
GER_operation_citadel_desc: "Решающее танковое сражение на Восточном фронте. Даёт опыт армии и ускоряет разработку танковых и доктринальных технологий."


GER_operation_western_operations: "Западные операции"
GER_operation_western_operations_desc: "Координация западных операций вермахта. Открывает операцию «Вахт ам Райн»."
GER_op_barbarossa_tt: "§YОткрывает «Unternehmen Barbarossa»§!"
