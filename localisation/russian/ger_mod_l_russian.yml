l_russian:
GER_fascism: "Германский Рейх"
GER_reichsform: "Рейхсреформплан"

GER_reichsform_tt: "Изменить §Y$GER_reichsform$§! на:"
GER_reichsreform_planD: "Приступить к выполнению Рейхсреформплана"

GER_reichsreform_planA: "Привлечь активы аристократии"
GER_reichsreform_planB: "Восстановление имперских арсеналов"

GER_reichsreform_planC: "«Стальные монстры Империи»"
steel_monsters: "«Стальные монстры Империи»"

GER_habsburger: "Габсбургский Кайзеррейх"
GER_legitimnost: "Легитимность новой Имперской власти"

GER_legitimnost_desc: "Возрождение имперской формы правления требует признания как внутри страны, так и за её пределами. Укрепляя традиции, институты и символы старого порядка, новая власть стремится доказать свою законность и право говорить от имени всей Империи."
GER_Papa_rimski: "Поддержка Папы Римского"

GER_Papa_rimski_desc: "Благословение Святого Престола способно придать имперской власти моральный вес и международное признание. Заручившись поддержкой Папы, мы укрепим свои позиции среди католических держав и подтвердим преемственность с христианским имперским наследием."
support_from_rome: "Поддержка из Рима"

GER_research: "Новые умы Новой Империи"
GER_research_desc: "Великие империи опирались не только на армию и традиции, но и на силу разума. Поддержка учёных, инженеров и новаторов должна стать основой технологического превосходства и долгосрочного величия имперской власти."

GER_carve_up_czechoslovaki: "Разделить Чехословакию"
GER_restore_two_empiresA: "Имперский эдикт о веротерпимости"

GER_otto_von_habsburg: "Отто фон Габсбург"
GER_restore_two_empiresB: "Закон о равноправии народов"

GER_restore_two_empiresC: "Провозглашение Дунайской Конфедерации"
GER_claims_austria: "Возвращение Габсбургов в Вену"

GER_attack_CZE: "Ликвидация чехословацкого государства"
GER_claims_vengria: "Восстановление венгерской унии"

GER_attack_YUG: "Усмирение южных славян"
GER_attack_ROM: "Трансильванский ультиматум"

GER_claims_italy: "Итальянский реванш"
GER_attack_POL: "Раздел польских территорий"

GER_restore_two_empires: "Объединяя две Империи"
GER_restore_two_empires_desc: "Пришло время исправить ошибки прошлого и объединить два великих дома."

GER_claims_austria_desc: "Австрия - это сердце империи Габсбургов. Мы начинаем процесс восстановления австрийской государственности в рамках нашего союза, чтобы вернуть Вене её былое величие и статус имперской столицы."
GER_attack_CZE_desc: "Чешские земли веками были частью имперского достояния. Пришло время разделить старые земли Богемии и Моравии между теми, кто способен ими управлять, восстановив историческую справедливость."

GER_claims_vengria_desc: "Венгерская корона святого Стефана должна вновь соединиться с имперским скипетром. Мы предъявим свои законные права на венгерские земли, чтобы восстановить целостность дунайской монархии."
GER_attack_YUG_desc: "Балканы всегда были зоной интересов империи. Югославия должна признать наше верховенство, иначе нам придется силой вернуть контроль над адриатическим побережьем."

GER_claims_italy_desc: "Италия долгое время извлекала выгоду из слабости Австрии. Мы предъявляем претензии на наши старые владения на севере полуострова; Ломбардия и Венеция должны вернуться в лоно империи."
GER_restore_two_empiresA_desc: "Восстановление власти Габсбургов требует пересмотра старых прусских порядков. Мы должны начать диалог с местными элитами и региональными правительствами, чтобы гарантировать, что возвращение монархии принесет стабильность, а не гражданский конфликт. Первый шаг к единой империи - это юридическое признание прав всех земель."

GER_restore_two_empiresB_desc: "Наша страна больше не является мононациональным государством. Чтобы избежать судьбы старой Австро-Венгрии, мы обязаны интегрировать многочисленные народы под власть единой короны. Введение статуса гражданина империи позволит нам снизить влияние радикальных националистов и направить энергию всех подданных на благо общего отечества."
GER_restore_two_empiresC_desc: "Реформы завершены, и многонациональный вопрос более не стоит так остро. Мы создали структуру, в которой и немец, и венгр, и чех чувствуют себя частью великого целого. Теперь, когда внутренние противоречия улажены, ничто не мешает нам заявить о своих претензиях на господство в Европе под знаменами двух орлов."

GER_attack_POL_desc: "Восшествие Габсбургов на престол вновь поднимает вопрос о судьбе земель, некогда принадлежавших их короне. Галиция и Лодомерия, утраченные после распада старых империй, остаются частью общего исторического и многонационального пространства. Во имя преемственности и стабильности выдвигается требование о пересмотре их нынешнего статуса."
GER_attack_ROM_desc: "Возвращение Габсбургов к власти вновь поднимает проблему территорий, утраченных после распада прежних империй. Трансильвания, многонациональный регион с долгой историей под властью короны, была отделена решениями послевоенной эпохи. Ради восстановления исторической преемственности предлагается пересмотреть её текущий статус."

GER_restore_german_territory: "Восстановить восточные имперские владения"
GER_restore_german_territory_desc: "Исконные земли нашей империи сейчас находятся под властью иностранных держав. Чтобы восстановить границы по Брестскому миру, придется для начала вернуть Познань, Западную Пруссию и Силезию."

GER_continue_claims_to_pol: "Потребовать от Польши дальнейших уступок"
GER_continue_claims_to_pol_desc: "Мы вынудили поляков вернуть нам главные земли старой империи, но этого мало. Границы по Брестскому миру пока не восстановлены, а Польша стоит на пути к воплощению мечты..."

GER_strike_eastwardHAB: "Уничтожить Большевизм"
GER_strike_eastwardHAB_desc: "Наши границы в безопасности. Теперь пора нанести удар по самому мощному противнику — нарушителю Брестского мира, угрозе стабильности в Восточной Европе. Это, разумеется, [SOV.GetNameDef]. Настал час захватить Москву и сбить с ног [SOV.GetAdjective]ого колосса."

GER_litva: "Ультиматум Литве"
GER_litva_desc: "Опыт Великой войны недвусмысленно говорит о том, что нам нужно быть готовыми защищать наши восточные владения. Следует укрепить рубежи с востока и подготовиться отразить вторжение. Однако для этого стратегически важный регион Мемельланд должен перейти под нашу власть."

GER_establish_eastern_grand_duchiesB: "[GetEasternDuchiesName]"
GER_establish_eastern_grand_duchiesB_desc: "Мы не можем напрямую контролировать все территории, подпадающие под действие договора. Вместо этого мы собираемся основать на востоке великие герцогства и королевства-сателлиты — их правители будут распоряжаться этими землями вместо нас."

restore_the_empires1: "Возродить Империю"
restore_the_empires2: "Вновь Империя"
restore_the_empires3: "Многонациональная Империя"

GER_hab_take_YUG.1t: "Югославский Вопрос"
GER_hab_take_YUG.1d: "Изменения в политическом устройстве Европы вновь поставили под сомнение границы, установленные после распада старых империй. Югославские многонациональные земли, некогда находившиеся под властью Габсбургской короны, рассматриваются как часть утраченного исторического наследия."
GER_hab_take_YUG.a: "Выдвинуть требования"
GER_hab_takeA_YUG.1t: "Имперские притязания"
GER_hab_take_YUG.1d: "К нам поступило требование о передаче территорий, ранее принадлежавших Габсбургской короне. Авторы обращения апеллируют к истории, преемственности и необходимости стабилизации региона.Принятие этих условий позволит избежать конфликта, однако отказ может привести к серьёзным последствиям."

GER_hab_takeA_YUG.a: "Мы не готовы к войне"
GER_hab_takeA_YUG.b: "Мы не уступим ни пяди земли"

GER_hab_YUG_accept.1t: "Мирное урегулирование"
GER_hab_YUG_accept.1d: "Переговоры завершились успехом. Спорные территории были переданы без применения силы, что позволило избежать вооружённого конфликта и восстановить контроль над землями, утраченными в эпоху послевоенного хаоса."

GER_hab_YUG_accept.a: "Историческая справедливость восстановлена"
GER_hab_YUG_decline.1t: "Отказ от компромисса"
GER_hab_YUG_decline.1d: "Наши требования были отвергнуты. Отказ от дипломатического решения ясно даёт понять, что мирный пересмотр границ невозможен.Если история не может быть исправлена словами, её придётся переписать силой."

GER_hab_YUG_decline.a: "Тогда решит оружие"
GER_hab_POL_claims.1t: "Галицийско-лодомерийский вопрос"
GER_hab_POL_claims.1d: "Возвращение Габсбургов к верховной власти вновь поднимает вопрос о землях, некогда принадлежавших их короне. Галиция и Лодомерия, утраченные после распада старых империй, оказались за пределами общего исторического пространства.Во имя преемственности и восстановления старого порядка выдвигается требование о передаче этих территорий Польшей мирным путём."

GER_hab_POL_claims.a: "Потребовать Галицию и Лодомерию"
GER_hab_POL_claims_question.1t: "Требования Габсбургской короны"
GER_hab_POL_claims_question.1d: "Польскому правительству предъявлено требование о передаче Галиции и Лодомерии - земель, которые Габсбурги считают неотъемлемой частью своего исторического наследия.Принятие условий позволит избежать войны, однако отказ может привести к открытому конфликту с возрождённой имперской властью."
GER_answer1.a: "Мы не можем рисковать войной"
GER_answer1.b: "Галиция - часть Польши"

GER_hab_POL_accept.1t: "Возвращение коронных земель"
GER_hab_POL_accept.1d: "Польша согласилась на мирную передачу Галиции и Лодомерии. Территориальный вопрос, оставшийся наследием послевоенного хаоса, был решён без применения силы, укрепив позиции Габсбургской короны и восстановив историческую преемственность."

GER_hab_accept.a: "Исторический порядок восстановлен"
GER_hab_POL_decline.1t: "Отказ Варшавы"
GER_hab_POL_decline.1d: "Польская сторона отвергла требования о передаче Галиции и Лодомерии. Дипломатический путь исчерпан, а отказ ясно даёт понять, что пересмотр границ возможен лишь силой."

GER_hab_POL_decline.a: "Мы возьмём своё"
GER_claims_to_italy.1t: "Адриатический вопрос"
GER_claims_to_italy.1d: "Итальянскому правительству предъявлено требование о передаче Трентино, Альто-Адидже, Триеста и Задара - территорий, которые Габсбурги рассматривают как часть своего исторического наследия.Принятие условий позволит избежать вооружённого конфликта, тогда как отказ может привести к эскалации напряжённости в Центральной Европе и Адриатике."
GER_claims_to_italy.a: "Италия не готова к войне"
GER_claims_to_italy.b: "Итальянская земля не продаётся"

GER_HAB_IMPERIA: "§YТеперь мы сможем включать бывшие территории Габсбургов в наш состав!§Y"

GER_integrate_conquered_territories: "Включить в состав регион в состав владений Габсбургов"
GER_integrate_conquered_territories_desc: "Завоёванные территории должны быть полностью интегрированы в состав Импери. Мы установим имперское управление, культуру и язык, чтобы укрепить нашу власть и обеспечить лояльность новых подданных. Это позволит нам создать единое и сильное государство, способное противостоять любым внешним угрозам."
GER_core_conquered_state: "Включить регион «[FROM.GetName]» в состав владений Габсбургов"
GER_core_conquered_state_desc: "Завоёванные территории исторически принадлежат дому Габсбургов и должны быть официально признаны частью нашей империи. Мы утвердим наши династические права на [FROM.GetName], обеспечив их полную интеграцию в государственную структуру Империи. Это укрепит наше влияние и создаст прочную основу для будущих поколений."

